name: CI

on:
  # 2026-11-10: skip CI when only docs change (README, notes, diagrams).
  # A change that touches any other file still runs everything.
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:

jobs:
  test:
    # macOS ships bash 3.2, the same shell snapcap.sh runs in on a Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, so the snapcap release can be read
      - name: Test snap_new_project
        run: bash tests/test_new_project.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Snapcap and test the storage fallback
        run: bash tests/test_storage_check.sh
