#! /bin/bash
#---------------------------------------------------------------
# >>>  snapcap.cfg  <<<
#---------------------------------------------------------------


# ===============================================================
# from .jayrc --> 
#                   ----> source .cfg files for each project in ~/jaycody:   
echo ""
echo "snapcap.cfg ----> $ source ..../snapcap/*.sh"   # 2026-11-10: was scripts/*.sh, see FOSSIL RECORD
echo "---------------------------------------------------------------"
l ${JAY_SPACE}/snapcap/*.sh
echo ""
echo ""

# ===============================================================



# source 'em up
# 2026-11-10: looped, because `. a.sh b.sh` only sources a.sh. Old line in FOSSIL RECORD.
for f in "${JAY_SPACE}"/snapcap/*.sh; do
    [ -f "$f" ] && . "$f"
done




